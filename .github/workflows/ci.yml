# push・プルリクエストのたびに、lint・型チェック・単体テスト・ビルドを通るか確かめる
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

# 同じブランチで新しく push されたら、古い実行は止める
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      # 環境変数（Supabase・GROQ のキー）なしでもビルドできる
      - run: npm run build
